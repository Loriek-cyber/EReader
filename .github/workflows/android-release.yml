name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag/name (es. 1.0.1 o v1.0.1, opzionale)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Compute release version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            CLEAN_VER="${INPUT_VERSION#v}"
            VERSION_NAME="${CLEAN_VER}"
            RELEASE_TAG="v${CLEAN_VER}"
          else
            VERSION_NAME="1.2.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Building EReader ${VERSION_NAME} (versionCode=${VERSION_CODE}) -> ${RELEASE_TAG}"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Using repository release keystore (keystore/ereader-release.jks)."
          fi

      - name: Run unit tests & build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Prepare Obtainium release assets
        run: |
          APK_NAME="EReader-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: EReader v${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            EReader-v${{ env.VERSION_NAME }}.apk
            EReader-v${{ env.VERSION_NAME }}.apk.sha256
